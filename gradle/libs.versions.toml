[versions]
# Android + Build Tools
agp = "8.12.3"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

# AndroidX
androidx-activity = "1.13.0"
androidx-lifecycle = "2.10.0"
materialIconsExtended = "1.7.8"

# Compose Multiplatform
composeMultiplatform = "1.11.1"

# moko libraries
graphics = "0.10.1"
resources = "0.26.4"
mokoResourcesPlugin = "0.26.4"

# Kotlin & Test
kotlin = "2.4.0"
kotlinxCoroutinesCore = "1.11.0"

# SQLDelight
sqldelight = "2.3.2"

[libraries]
# Kotlin / Test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# AndroidX Core + Compose Integration
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }

# SQLDelight libraries
sqldelight-androidDriver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-nativeDriver  = { module = "app.cash.sqldelight:native-driver",  version.ref = "sqldelight" }
sqldelight-coroutines    = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# moko libraries
graphics = { module = "dev.icerock.moko:graphics", version.ref = "graphics" }
resources = { module = "dev.icerock.moko:resources", version.ref = "resources" }
resources-test = { module = "dev.icerock.moko:resources-test", version.ref = "resources" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary     = { id = "com.android.library",    version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# moko-resources Gradle Plugin
mokoResources = { id = "dev.icerock.mobile.multiplatform-resources", version.ref = "mokoResourcesPlugin" }

# SQLDelight Gradle plugin
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
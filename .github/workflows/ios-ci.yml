name: iOS CI (XCFramework)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15

    env:
      # 👉 Falls du eine Workspace nutzt, setze WORKSPACE und lasse PROJECT leer
      PROJECT: iosApp/iosApp.xcodeproj
      WORKSPACE: ""                  # z.B.: iosApp/iosApp.xcworkspace
      SCHEME: iosApp
      DERIVED: build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List installed Xcodes (debug)
        run: ls -1 /Applications | grep -i Xcode || true

      - name: Select Xcode 17 (preferred)
        id: xcode_17
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '17.*'

      - name: Fallback to Xcode 16
        if: ${{ steps.xcode_17.outcome == 'failure' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.*'

      - name: Print Xcode version (debug)
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      # ⬇️ XCFramework(s) über KMP Tasks bauen (ohne CocoaPods)
      - name: Build XCFramework(s)
        run: |
          set -e
          ./gradlew :shared:assembleSharedDebugXCFramework --stacktrace
          # Optional:
          # ./gradlew :shared:assembleSharedReleaseXCFramework --stacktrace

      - name: Zip XCFramework(s)
        run: |
          set -e
          DBG_DIR="shared/build/XCFrameworks/debug/Shared.xcframework"
          if [ -d "$DBG_DIR" ]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$DBG_DIR" "Shared-debug.xcframework.zip"
          fi
          REL_DIR="shared/build/XCFrameworks/release/Shared.xcframework"
          if [ -d "$REL_DIR" ]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$REL_DIR" "Shared-release.xcframework.zip"
          fi

      - name: Upload XCFramework (Debug)
        if: ${{ hashFiles('Shared-debug.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-debug
          path: Shared-debug.xcframework.zip
          if-no-files-found: warn

      - name: Upload XCFramework (Release)
        if: ${{ hashFiles('Shared-release.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-release
          path: Shared-release.xcframework.zip
          if-no-files-found: warn

      # ⬇️ Optional: iOS-App bauen – ohne Pods
      - name: Install xcpretty
        run: sudo gem install xcpretty --no-document

      - name: Build iosApp (Debug, Simulator)
        run: |
          set -euo pipefail
          DEST="generic/platform=iOS Simulator"

          if [ -n "${WORKSPACE}" ]; then
            # Build über .xcworkspace
            xcodebuild \
              -workspace "${WORKSPACE}" \
              -scheme "${SCHEME}" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "${DEST}" \
              -derivedDataPath "${DERIVED}" \
              CODE_SIGNING_ALLOWED=NO \
              build | xcpretty
          else
            # Build über .xcodeproj
            xcodebuild \
              -project "${PROJECT}" \
              -scheme "${SCHEME}" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "${DEST}" \
              -derivedDataPath "${DERIVED}" \
              CODE_SIGNING_ALLOWED=NO \
              build | xcpretty
          fi

      - name: Upload iOS .app (Simulator Debug)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-Debug-iphonesimulator
          path: |
            ${{
              env.DERIVED
            }}/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
name: iOS CI (XCFramework, no CocoaPods)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle Cache + Wrapper-Validation
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      # 1) KMP: XCFramework bauen (Debug). Falls du Release willst, unten Alternative aktivieren.
      - name: Build Shared.xcframework (Debug)
        run: ./gradlew :shared:podPublishDebugXCFramework --stacktrace

      - name: Build Shared.xcframework (Release)
        run: ./gradlew :shared:podPublishReleaseXCFramework --stacktrace

      # Optional: Artefakt ablegen (nützlich für Debugging / Downloads aus dem CI)
      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-debug
          path: shared/build/cocoapods/publish/debug/Shared.xcframework
          if-no-files-found: warn

      # 2) iOS-App mit Xcode bauen (ohne CocoaPods)
      #    WICHTIG: Dein Xcode-Projekt muss Shared.xcframework bereits eingebunden haben
      #    und die Run Script Phase zum Kopieren des moko-resources-Bundles behalten.
      - name: Build iosApp (Debug, Simulator)
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      # Optional: App-Artefakt hochladen (Simulator .app)
      - name: Upload iOS build products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
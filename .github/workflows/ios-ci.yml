name: iOS CI (XCFramework)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15

    env:
      # Falls du eine .xcworkspace nutzt: WORKSPACE setzen und PROJECT leer lassen
      PROJECT: iosApp/iosApp.xcodeproj
      WORKSPACE: ""                  # z.B. iosApp/iosApp.xcworkspace
      SCHEME: iosApp
      DERIVED: build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 17 (preferred)
        id: xcode_17
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '17.*'

      - name: Fallback to Xcode 16
        if: ${{ steps.xcode_17.outcome == 'failure' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.*'

      - name: Print Xcode version (debug)
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      # ⬇️ Erzeuge XCFramework an dem Pfad, den Xcode erwartet (cocoapods/publish/debug)
      - name: Build XCFramework (Debug) at cocoapods/publish path
        run: |
          set -e
          ./gradlew :shared:podPublishDebugXCFramework --stacktrace
          # Optional zusätzlich:
          # ./gradlew :shared:podPublishReleaseXCFramework --stacktrace

      - name: Zip XCFramework(s)
        run: |
          set -e
          DBG_DIR="shared/build/cocoapods/publish/debug/Shared.xcframework"
          if [ -d "$DBG_DIR" ]; then
            pushd "$(dirname "$DBG_DIR")"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Shared.xcframework" "../../Shared-debug.xcframework.zip"
            popd
          fi
          REL_DIR="shared/build/cocoapods/publish/release/Shared.xcframework"
          if [ -d "$REL_DIR" ]; then
            pushd "$(dirname "$REL_DIR")"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Shared.xcframework" "../../Shared-release.xcframework.zip"
            popd
          fi

      - name: Upload XCFramework (Debug)
        if: ${{ hashFiles('shared/build/cocoapods/publish/Shared-debug.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-debug
          path: shared/build/cocoapods/publish/Shared-debug.xcframework.zip
          if-no-files-found: warn

      - name: Upload XCFramework (Release)
        if: ${{ hashFiles('shared/build/cocoapods/publish/Shared-release.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-release
          path: shared/build/cocoapods/publish/Shared-release.xcframework.zip
          if-no-files-found: warn

      - name: Install xcpretty
        run: sudo gem install xcpretty --no-document

      # ⬇️ iOS-App bauen (ohne Pods), das Framework liegt am erwarteten Ort
      - name: Build iosApp (Debug, Simulator)
        run: |
          set -euo pipefail
          DEST="generic/platform=iOS Simulator"

          if [ -n "${WORKSPACE}" ]; then
            xcodebuild \
              -workspace "${WORKSPACE}" \
              -scheme "${SCHEME}" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "${DEST}" \
              -derivedDataPath "${DERIVED}" \
              CODE_SIGNING_ALLOWED=NO \
              build | xcpretty
          else
            xcodebuild \
              -project "${PROJECT}" \
              -scheme "${SCHEME}" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "${DEST}" \
              -derivedDataPath "${DERIVED}" \
              CODE_SIGNING_ALLOWED=NO \
              build | xcpretty
          fi

      - name: Upload iOS .app (Simulator Debug)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-Debug-iphonesimulator
          path: |
            ${{
              env.DERIVED
            }}/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
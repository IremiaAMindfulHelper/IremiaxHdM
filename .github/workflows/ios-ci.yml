# /**
#  * iOS CI Pipeline (XCFramework & App Build)
#  *
#  * This workflow builds the shared KMP XCFramework and compiles the iOS app
#  * on a macOS runner. It ensures compatibility with Xcode 17 (fallback 16)
#  * and uploads zipped build artifacts for simulator testing.
#  *
#  * Key goals:
#  * - Provide stable CI builds for iOS using the shared Kotlin codebase.
#  * - Automatically retry and fallback between Xcode versions.
#  * - Build both the Shared.xcframework and the iOS app (Debug).
#  * - Avoid upload errors caused by “:” characters in .app bundles.
#  */

name: iOS CI (XCFramework)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15

    env:
      PROJECT: iosApp/iosApp.xcodeproj     # Xcode project file
      WORKSPACE: ""                        # if you use a .xcworkspace instead, set path here
      SCHEME: iosApp                       # build scheme
      DERIVED: build/DerivedData           # derived data output folder

    steps:
      # Checkout repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Select Xcode version 17.* (preferred)
      - name: Select Xcode 17 (preferred)
        id: xcode_17
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '17.*'

      # Fallback if Xcode 17 not available (use 16.*)
      - name: Fallback to Xcode 16
        if: ${{ steps.xcode_17.outcome == 'failure' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.*'

      # Log active Xcode setup for debugging
      - name: Print Xcode version (debug)
        run: |
          xcodebuild -version
          xcode-select -p

      # Install Java 17 for Gradle/Kotlin builds
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache Gradle build data
      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Validate Gradle wrapper (soft fail to avoid network issues)
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      # NOTE: Builds the XCFramework at the same path Xcode expects (cocoapods/publish)
      - name: Build XCFramework (Debug) at cocoapods/publish path
        run: |
          set -e
          ./gradlew :shared:podPublishDebugXCFramework --stacktrace
          # Optional: uncomment for release version
          # ./gradlew :shared:podPublishReleaseXCFramework --stacktrace

      # Compress XCFrameworks to avoid issues with “:” in filenames
      - name: Zip XCFramework(s)
        run: |
          set -e
          DBG_DIR="shared/build/cocoapods/publish/debug/Shared.xcframework"
          if [ -d "$DBG_DIR" ]; then
            pushd "$(dirname "$DBG_DIR")"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Shared.xcframework" "../../Shared-debug.xcframework.zip"
            popd
          fi
          REL_DIR="shared/build/cocoapods/publish/release/Shared.xcframework"
          if [ -d "$REL_DIR" ]; then
            pushd "$(dirname "$REL_DIR")"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Shared.xcframework" "../../Shared-release.xcframework.zip"
            popd
          fi

      # Upload generated artifacts (XCFrameworks)
      - name: Upload XCFramework (Debug)
        if: ${{ hashFiles('shared/build/cocoapods/publish/Shared-debug.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-debug
          path: shared/build/cocoapods/publish/Shared-debug.xcframework.zip
          if-no-files-found: warn

      - name: Upload XCFramework (Release)
        if: ${{ hashFiles('shared/build/cocoapods/publish/Shared-release.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-release
          path: shared/build/cocoapods/publish/Shared-release.xcframework.zip
          if-no-files-found: warn

      # Install xcpretty for readable xcodebuild logs
      - name: Install xcpretty
        run: sudo gem install xcpretty --no-document

      # Build the iOS app for arm64 simulator
      - name: Build iosApp (Debug, arm64 Simulator)
        run: |
          set -euo pipefail
          DEST="generic/platform=iOS Simulator"

          # Build using either workspace or project depending on configuration
          if [ -n "${WORKSPACE}" ]; then
            xcodebuild \
              -workspace "${WORKSPACE}" \
              -scheme "${SCHEME}" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "${DEST}" \
              -derivedDataPath "${DERIVED}" \
              CODE_SIGNING_ALLOWED=NO \
              ARCHS=arm64 \
              EXCLUDED_ARCHS="x86_64 i386" \
              ONLY_ACTIVE_ARCH=YES \
              build | xcpretty
          else
            xcodebuild \
              -project "${PROJECT}" \
              -scheme "${SCHEME}" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "${DEST}" \
              -derivedDataPath "${DERIVED}" \
              CODE_SIGNING_ALLOWED=NO \
              ARCHS=arm64 \
              EXCLUDED_ARCHS="x86_64 i386" \
              ONLY_ACTIVE_ARCH=YES \
              build | xcpretty
          fi

      # NOTE: Zipping the .app bundle avoids artifact upload errors due to ":" in paths
      - name: Zip .app (Simulator Debug)
        run: |
          set -e
          APP_DIR="$(/usr/bin/find "${DERIVED}/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name "*.app" | head -n1)"
          if [ -z "$APP_DIR" ]; then
            echo "No .app found to zip."
            exit 0
          fi
          echo "Zipping: $APP_DIR"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "iosApp-Debug.app.zip"

      # Upload zipped iOS app (ready for simulator)
      - name: Upload iOS .app (Simulator Debug, zipped)
        if: ${{ hashFiles('iosApp-Debug.app.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-Debug-iphonesimulator
          path: iosApp-Debug.app.zip
          if-no-files-found: warn
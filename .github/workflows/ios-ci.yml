name: iOS CI (XCFramework)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Logge, welche Xcode-Versionen auf dem Runner verfügbar sind (Debug)
      - name: List installed Xcodes
        run: ls -1 /Applications | grep -i Xcode || true

      # 1) Versuch: exakt deine Buildnummer (17A400)
      - name: Select Xcode by build (17A400)
        id: xcode_build
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '17A400'

      # 2) Fallback: gesamte Hauptversion (z. B. 16.*), falls 17A400 nicht existiert
      - name: Select Xcode 16 (fallback)
        if: ${{ steps.xcode_build.outcome == 'failure' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.*'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      # KMP -> XCFramework (ohne CocoaPods)
      - name: Build XCFramework(s)
        run: |
          set -e
          ./gradlew :shared:assembleSharedDebugXCFramework --stacktrace
          # optional:
          # ./gradlew :shared:assembleSharedReleaseXCFramework --stacktrace

      - name: Zip XCFramework(s)
        run: |
          set -e
          DBG_DIR="shared/build/XCFrameworks/debug/Shared.xcframework"
          if [ -d "$DBG_DIR" ]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$DBG_DIR" "Shared-debug.xcframework.zip"
          fi
          REL_DIR="shared/build/XCFrameworks/release/Shared.xcframework"
          if [ -d "$REL_DIR" ]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$REL_DIR" "Shared-release.xcframework.zip"
          fi

      - name: Upload XCFramework (Debug)
        if: ${{ hashFiles('Shared-debug.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-debug
          path: Shared-debug.xcframework.zip
          if-no-files-found: warn

      - name: Upload XCFramework (Release)
        if: ${{ hashFiles('Shared-release.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-release
          path: Shared-release.xcframework.zip
          if-no-files-found: warn

      # Optional: iOS-App bauen (achte auf .xcodeproj vs .xcworkspace!)
      - name: Install xcpretty
        run: sudo gem install xcpretty --no-document

      - name: Build iosApp (Debug, Simulator)
        run: |
          set -euo pipefail
          # Falls du eine Workspace hast, nimm -workspace und setze PROJECT_PATH auf die .xcworkspace
          PROJECT_PATH="iosApp/iosApp.xcodeproj"
          SCHEME="iosApp"
          DEST="platform=iOS Simulator,name=iPhone 15"
          DERIVED="build/DerivedData"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      - name: Upload iOS .app (Simulator Debug)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-Debug-iphonesimulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
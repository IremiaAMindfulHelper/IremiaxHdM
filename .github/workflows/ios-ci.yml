name: iOS CI (XCFramework)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      # ⬇️ XCFramework(s) direkt über die KMP-Tasks bauen (ohne CocoaPods)
      - name: Build XCFramework(s)
        run: |
          set -e
          # Debug reicht in der Regel – Release optional einkommentieren
          ./gradlew :shared:assembleSharedDebugXCFramework --stacktrace
          # ./gradlew :shared:assembleSharedReleaseXCFramework --stacktrace

      # ⬇️ Zippen, damit der Doppelpunkt in Bundle-Namen den Artifact-Upload nicht killt
      - name: Zip XCFramework(s)
        run: |
          set -e
          DBG_DIR="shared/build/XCFrameworks/debug/Shared.xcframework"
          if [ -d "$DBG_DIR" ]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$DBG_DIR" "Shared-debug.xcframework.zip"
          fi

          REL_DIR="shared/build/XCFrameworks/release/Shared.xcframework"
          if [ -d "$REL_DIR" ]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$REL_DIR" "Shared-release.xcframework.zip"
          fi

      - name: Upload XCFramework (Debug)
        if: ${{ hashFiles('Shared-debug.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-debug
          path: Shared-debug.xcframework.zip
          if-no-files-found: warn

      - name: Upload XCFramework (Release)
        if: ${{ hashFiles('Shared-release.xcframework.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework-release
          path: Shared-release.xcframework.zip
          if-no-files-found: warn

      # ⬇️ Optional: iOS-App (Xcode) bauen – ohne Pods
      - name: Install xcpretty (optional but nice)
        run: sudo gem install xcpretty --no-document

      - name: Build iosApp (Debug, Simulator)
        run: |
          set -euo pipefail
          WORKSPACE="iosApp/iosApp.xcworkspace"  # ggf. auf .xcworkspace anpassen
          SCHEME="iosApp"                          # ggf. anpassen
          DEST="platform=iOS Simulator,name=iPhone 15"
          DERIVED="build/DerivedData"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      - name: Upload iOS .app (Simulator Debug)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-Debug-iphonesimulator
          path: |
            build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
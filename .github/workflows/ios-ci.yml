name: iOS CI (CocoaPods)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/gradle-build-action@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install Ruby & CocoaPods
        run: |
          sudo gem install cocoapods --no-document

      # Optionaler Cache für Pods (beschleunigt pod install)
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # 1) KMP -> Podspec + XCFramework erzeugen
      - name: Build KMP XCFramework via CocoaPods
        run: ./gradlew :shared:podPublishXCFramework --stacktrace

      - name: Upload XCFramework & Podspec
        uses: actions/upload-artifact@v4
        with:
          name: shared-cocoapods-xcframework
          path: |
            shared/build/cocoapods/framework/**/*
            shared/*.podspec
          if-no-files-found: warn

      # 2) (Optional) iOS-App bauen, falls du eine iosApp hast
      - name: Install Pods in iosApp
        if: ${{ hashFiles('iosApp/Podfile') != '' }}
        run: |
          cd iosApp
          pod install --repo-update

      - name: Build iosApp (Debug, Simulator)
        if: ${{ hashFiles('iosApp/*.xcworkspace') != '' || hashFiles('iosApp/*.xcodeproj') != '' }}
        run: |
          set -euo pipefail
          SCHEME="iosApp"
          DEST="platform=iOS Simulator,name=iPhone 15"

          if ls iosApp/*.xcworkspace >/dev/null 2>&1; then
            xcodebuild \
              -workspace iosApp/*.xcworkspace \
              -scheme "$SCHEME" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "$DEST" \
              CODE_SIGNING_ALLOWED=NO \
              build | xcpretty || true
          else
            xcodebuild \
              -project iosApp/*.xcodeproj \
              -scheme "$SCHEME" \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination "$DEST" \
              CODE_SIGNING_ALLOWED=NO \
              build | xcpretty || true
          fi

      - name: Upload iOS build products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            iosApp/build/**/*
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
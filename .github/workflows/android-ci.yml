# /**
#  * Android CI Pipeline (robust build)
#  *
#  * This workflow compiles the Android app and shared KMP module on Ubuntu,
#  * including automatic retries, Gradle caching, and dependency warmup.
#  *
#  * Key goals:
#  * - Increase stability under network or Gradle flakiness.
#  * - Reuse build caches and Maven artifacts.
#  * - Separate dependency resolution, build, and test phases.
#  * - Automatically retry transient errors (3× attempts).
#  */

name: Android CI (robust)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      # NOTE: prefer IPv4 and extend HTTP timeouts for Gradle connections
      GRADLE_OPTS: >-
        -Djava.net.preferIPv4Stack=true
        -Dorg.gradle.internal.http.socketTimeout=120000
        -Dorg.gradle.internal.http.connectionTimeout=120000

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Install JDK 17 (Temurin)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      # Cache Gradle wrapper distributions to speed up downloads
      - name: Cache Gradle Wrapper dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      # Validate Gradle wrapper; soft fail if network temporarily unavailable
      - name: Validate Gradle Wrapper (soft)
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
        timeout-minutes: 5

      # Setup Gradle build caching (includes dependency cache)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Create ~/.gradle/gradle.properties with robust defaults
      - name: Prepare ~/.gradle/gradle.properties
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
          org.gradle.daemon=false
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.internal.http.socketTimeout=120000
          org.gradle.internal.http.connectionTimeout=120000
          EOF
          echo "=== ~/.gradle/gradle.properties ==="
          cat ~/.gradle/gradle.properties

      # Optional: warm up Maven connections to avoid first-request delays
      - name: Network warmup (optional)
        run: |
          set -e
          for u in https://repo.maven.apache.org/maven2/ https://plugins.gradle.org/ ; do
            echo "HEAD $u"
            curl -I --retry 3 --retry-all-errors --max-time 30 "$u" || true
          done

      # Resolve dependencies with up to 3 retries
      - name: Gradle dependencies (retry x3)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Resolve attempt $attempt/3"
            if ./gradlew --no-daemon :composeApp:dependencies :shared:dependencies -s; then
              exit 0
            fi
            echo "Dependency resolve failed (attempt $attempt). Sleeping 20s and retrying…"
            sleep 20
          done
          echo "Dependency resolve failed after 3 attempts."
          exit 1

      # Build Android debug variant, retry up to 3× for transient errors
      - name: Assemble Android Debug (retry x3)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon clean :composeApp:assembleDebug :shared:build -s; then
            exit 0
          fi
          echo "Build failed (1/3). Sleeping 20s…"; sleep 20
          if ./gradlew --no-daemon :composeApp:assembleDebug :shared:build -s; then
            exit 0
          fi
          echo "Build failed (2/3). Sleeping 20s…"; sleep 20
          ./gradlew --no-daemon :composeApp:assembleDebug :shared:build -s --refresh-dependencies

      # Run unit tests (separate step to keep visibility)
      - name: Unit Tests (Debug)
        timeout-minutes: 15
        run: ./gradlew --no-daemon testDebugUnitTest -s

      # Upload build artifacts (.apk / .aab)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            composeApp/build/outputs/**/*.apk
            composeApp/build/outputs/**/*.aab
          if-no-files-found: warn
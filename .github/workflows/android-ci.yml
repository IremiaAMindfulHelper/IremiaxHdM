name: Android CI (robust)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      # Bevorzuge IPv4 & erhöhe HTTP-Timeouts für Gradle
      GRADLE_OPTS: >-
        -Djava.net.preferIPv4Stack=true
        -Dorg.gradle.internal.http.socketTimeout=120000
        -Dorg.gradle.internal.http.connectionTimeout=120000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle' # Maven/Gradle-Cache via setup-java aktiv

      # Optional: zusätzlicher Cache für Gradle Wrapper-Distributionen
      - name: Cache Gradle Wrapper dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      # Gradle Wrapper validieren (weich, damit Netzflaker nicht den Build kippen)
      - name: Validate Gradle Wrapper (soft)
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
        timeout-minutes: 5

      # Integriertes Gradle Caching (Build-Scans optional)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle-Properties auf Runner schärfen (IPv4 + Timeouts + kein Daemon)
      - name: Prepare ~/.gradle/gradle.properties
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
          org.gradle.daemon=false
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.internal.http.socketTimeout=120000
          org.gradle.internal.http.connectionTimeout=120000
          EOF
          echo "=== ~/.gradle/gradle.properties ==="
          cat ~/.gradle/gradle.properties

      # Warmup: leichte Requests damit das Netzwerk „wach“ ist (optional)
      - name: Network warmup (optional)
        run: |
          set -e
          for u in https://repo.maven.apache.org/maven2/ https://plugins.gradle.org/ ; do
            echo "HEAD $u"
            curl -I --retry 3 --retry-all-errors --max-time 30 "$u" || true
          done

      # Dependencies auflösen (mit Retries)
      - name: Gradle dependencies (retry x3)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Resolve attempt $attempt/3"
            if ./gradlew --no-daemon :composeApp:dependencies :shared:dependencies -s; then
              exit 0
            fi
            echo "Dependency resolve failed (attempt $attempt). Sleeping 20s and retrying…"
            sleep 20
          done
          echo "Dependency resolve failed after 3 attempts."
          exit 1

      # Build (mit Retries; letzter Versuch mit --refresh-dependencies)
      - name: Assemble Android Debug (retry x3)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon clean :composeApp:assembleDebug :shared:build -s; then
            exit 0
          fi
          echo "Build failed (1/3). Sleeping 20s…"; sleep 20
          if ./gradlew --no-daemon :composeApp:assembleDebug :shared:build -s; then
            exit 0
          fi
          echo "Build failed (2/3). Sleeping 20s…"; sleep 20
          ./gradlew --no-daemon :composeApp:assembleDebug :shared:build -s --refresh-dependencies

      # Unit Tests (separat, damit Build-Ergebnis nicht überschattet wird)
      - name: Unit Tests (Debug)
        timeout-minutes: 15
        run: ./gradlew --no-daemon testDebugUnitTest -s

      # Artefakte hochladen
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            composeApp/build/outputs/**/*.apk
            composeApp/build/outputs/**/*.aab
          if-no-files-found: warn